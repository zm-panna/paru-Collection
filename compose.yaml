services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  web:
    build: .
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=sql;Database=ParuEcommerceERP;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Seed__AdminEmail: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      Ollama__BaseUrl: http://host.docker.internal:11434/
      Ollama__Model: ${OLLAMA_MODEL:-}
      DataProtection__Path: /app/keys
      AllowedHosts: localhost;127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
      - keys:/app/keys
      - documents:/app/App_Data/documents
      - receipts:/app/App_Data/receipts
volumes:
  sqldata:
  uploads:
  keys:
  documents:
  receipts:
